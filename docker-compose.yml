services:
  postgres:
    image: pgvector/pgvector:pg16-bookworm
    container_name: victus-webapp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-victus_app}
      POSTGRES_USER: ${POSTGRES_USER:-victus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-victus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - victus_webapp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-victus} -d ${POSTGRES_DB:-victus_app}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: victus-webapp-backend
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      ENABLE_DEV_AUTH: ${ENABLE_DEV_AUTH:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-victus}:${POSTGRES_PASSWORD:-victus}@postgres:5432/${POSTGRES_DB:-victus_app}
      POSTGRES_HOST: postgres
      POSTGRES_INTERNAL_PORT: 5432
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://localhost:8000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: victus-webapp-frontend
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_AUTH_BASE_URL: ${VITE_AUTH_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - victus_webapp_frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  victus_webapp_postgres_data:
  victus_webapp_frontend_node_modules:
